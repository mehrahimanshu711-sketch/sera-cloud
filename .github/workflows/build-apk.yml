name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: |
          flutter create . --platforms=android --project-name sera_cloud --overwrite

      - name: Fix minSdkVersion and Permissions
        run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle || true
          
          # Add permissions to AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' android/app/src/main/AndroidManifest.xml

      - name: Inject pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: sera_cloud
          description: "Sera AI Hands-Free Assistant"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_inappwebview: ^6.0.0
            permission_handler: ^11.3.0
            wakelock_plus: ^1.2.8

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

      - name: Inject Hands-Free Main.dart Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            
            // Request critical permissions
            await [
              Permission.microphone,
              Permission.systemAlertWindow,
            ].request();

            // Enable WakeLock so phone CPU doesn't sleep in lock screen
            WakelockPlus.enable();

            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Sera AI',
                theme: ThemeData.dark(),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            InAppWebViewController? webViewController;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: InAppWebView(
                    initialUrlRequest: URLRequest(
                      url: WebUri("https://sera-cloud-5ivn.onrender.com"),
                    ),
                    initialSettings: InAppWebViewSettings(
                      javaScriptEnabled: true,
                      mediaPlaybackRequiresUserGesture: false,
                      allowsInlineMediaPlayback: true,
                      keepAliveEnabled: true,
                    ),
                    onPermissionRequest: (controller, request) async {
                      return PermissionResponse(
                        resources: request.resources,
                        action: PermissionRequestResponseAction.GRANT,
                      );
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sera-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
